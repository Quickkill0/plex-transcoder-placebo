name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'   # Monday, to pick up new Plex source drops

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mod image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The mod image is FROM scratch, so there's no shell to exec -- read the sha out of
      # the layer instead. Also proves the expected payload actually landed in the image.
      - name: Extract Plex source sha
        id: src
        run: |
          # FROM scratch has no CMD/ENTRYPOINT and `docker create` refuses without one.
          # The container is never started, so the entrypoint needn't exist.
          cid=$(docker create --entrypoint /bin/true ${{ env.IMAGE }}:latest)
          docker cp "$cid:/plex-placebo/PLEX_SOURCE_SHA" ./sha.txt
          docker cp "$cid:/plex-placebo/bin/Plex-Transcoder-placebo" ./transcoder
          docker rm "$cid" >/dev/null
          test -s ./transcoder
          echo "sha=$(cat sha.txt)" >> "$GITHUB_OUTPUT"

      # Tag and push the image we already loaded, rather than building a second time.
      # build.sh fetches Plex's *latest* source, so a rebuild could pick up a different
      # release than the one we read the sha from and mislabel the :plex-<sha> tag.
      - name: Push
        run: |
          docker tag ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:plex-${{ steps.src.outputs.sha }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:plex-${{ steps.src.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### Built \`${{ env.IMAGE }}:latest\`"
            echo
            echo "Plex source sha: \`${{ steps.src.outputs.sha }}\`"
            echo
            echo 'Should match the dir under `Plex Media Server/Codecs/<sha>-<hash>-linux-x86_64/`.'
          } >> "$GITHUB_STEP_SUMMARY"
