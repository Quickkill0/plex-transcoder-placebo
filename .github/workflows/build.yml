name: build

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this source sha is already published
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'   # daily; the check below costs one 16KB request

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SRC_URL: https://downloads.plex.tv/ffmpeg-source/

jobs:
  # Plex publishes no release schedule, and PMS releases are a poor proxy anyway: the
  # transcoder source changes far more rarely than the server does. So ask the source
  # itself. The tarball's top-level directory is named for the sha, and gzip decompresses
  # sequentially, so a range request for the first 16KB is enough to read it -- no need to
  # pull 85MB just to find out nothing changed.
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Resolve Plex source sha
        id: sha
        run: |
          curl -sSL -r 0-16383 --max-time 60 "$SRC_URL" -o head.gz
          # gunzip necessarily fails on a deliberately truncated stream, so isolate it from
          # pipefail. Downstream has no early-exit commands (sed reads to EOF), so no SIGPIPE.
          gunzip -c head.gz > raw.bin 2>/dev/null || true
          sha=$(tr -c '[:print:]\n' '\n' < raw.bin \
            | sed -nE 's/.*plexinc-plex-media-server-ffmpeg-gpl-([0-9a-f]{40}).*/\1/p' \
            | sed -n '1p')
          [ -n "$sha" ] || { echo "could not resolve source sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Plex source sha: $sha"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: decide
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:plex-${{ steps.sha.outputs.sha }}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already published, nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mod image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag from the sha baked into the image, not the one the check job resolved: build.sh
      # re-fetches the source, so if Plex published in between, those two disagree and only
      # the image's own copy describes what was actually built.
      - name: Extract Plex source sha
        id: src
        run: |
          # FROM scratch has no CMD/ENTRYPOINT and `docker create` refuses without one.
          # The container is never started, so the entrypoint needn't exist.
          cid=$(docker create --entrypoint /bin/true ${{ env.IMAGE }}:latest)
          docker cp "$cid:/plex-placebo/PLEX_SOURCE_SHA" ./sha.txt
          docker cp "$cid:/plex-placebo/bin/Plex-Transcoder-placebo" ./transcoder
          docker rm "$cid" >/dev/null
          test -s ./transcoder
          echo "sha=$(cat sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Push
        run: |
          docker tag ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:plex-${{ steps.src.outputs.sha }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:plex-${{ steps.src.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### Built \`${{ env.IMAGE }}:latest\`"
            echo
            echo "Plex source sha: \`${{ steps.src.outputs.sha }}\`"
            echo
            echo 'Should match the dir under `Plex Media Server/Codecs/<sha>-<hash>-linux-x86_64/`.'
          } >> "$GITHUB_STEP_SUMMARY"
